name: Build Argentas-Comandas
# build trigger
# manual build trigger

on:
  push:
    branches:
      - main
      - "feature/bluetooth-base"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Argentas original + Comandas
        run: python3 scripts/prepare_argentas.py

      - name: Verify generated Comandas source
        run: |
          test -s app/src/main/assets/index.html
          grep -q "status:'recibido'" app/src/main/assets/index.html
          grep -q "argentas-vender-cancel-draft" app/src/main/assets/index.html
          grep -q "existing.status==='entregada'" app/src/main/assets/index.html
          grep -q "existing.status==='cancelada'" app/src/main/assets/index.html
          ! grep -q "existing.status==='preparando'" app/src/main/assets/index.html

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Argentas-Comandas-debug
          path: app/build/outputs/apk/debug/app-debug.apk
