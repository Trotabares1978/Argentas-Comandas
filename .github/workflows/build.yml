name: Build Argentas-Comandas
# build trigger
# manual build trigger

on:
  push:
    branches:
      - main
      - "feature/bluetooth-base"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Argentas original + Comandas
        run: python3 scripts/prepare_argentas.py

      - name: Verify generated Comandas source
        run: |
          test -s app/src/main/assets/index.html
          grep -q "status:'recibido'" app/src/main/assets/index.html
          grep -q "stateVersion=4" app/src/main/assets/index.html
          grep -q "data-order-tap" app/src/main/assets/index.html
          grep -q "setStatus(id,'oculta')" app/src/main/assets/index.html
          grep -q "incomingAt<=Number(existing.updatedAt||existing.createdAt||0)" app/src/main/assets/index.html
          grep -q "30px!important" app/src/main/assets/index.html
          grep -q "argentas-vender-cancel-draft" app/src/main/assets/index.html
          grep -q "nextDailyNumber(todayKey())" app/src/main/assets/index.html
          grep -q "id=\"ac-undo\"" app/src/main/assets/index.html
          grep -q "MOSTRAR DISPOSITIVOS" app/src/main/assets/index.html
          grep -q "ARGENTAS DISPONIBLES" app/src/main/assets/index.html
          ! grep -q "ESPERAR CONEXIÓN" app/src/main/assets/index.html
          ! grep -q "BUSCAR VINCULADOS" app/src/main/assets/index.html
          grep -q "¿Querés conectar con Argentas" app/src/main/assets/index.html
          grep -q "function undo()" app/src/main/assets/index.html
          grep -q "salesSnapshot()" app/src/main/assets/index.html
          grep -q "mergeSales(sales||\[\])" app/src/main/assets/index.html
          grep -q "merge(m.db,m.sales||\[\])" app/src/main/assets/index.html
          grep -q "argentas-sales-sync" app/src/main/assets/index.html
          ! grep -q "document.addEventListener('DOMContentLoaded',install)" app/src/main/assets/index.html
          test "$(grep -o "window.addEventListener('argentas-bluetooth'" app/src/main/assets/index.html | wc -l)" -eq 2
          grep -q "existing.lines||\[\]" app/src/main/assets/index.html
          grep -q "existing.status==='entregada'" app/src/main/assets/index.html
          grep -q "existing.status==='cancelada'" app/src/main/assets/index.html
          ! grep -q "existing.status==='preparando'" app/src/main/assets/index.html

      - name: Validate embedded JavaScript
        run: |
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          html=Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, flags=re.S|re.I)
          for i,script in enumerate(scripts):
              p=Path(f"/tmp/argentas-script-{i}.js")
              p.write_text(script,encoding="utf-8")
              subprocess.run(["node","--check",str(p)],check=True)
          print(f"Validated {len(scripts)} embedded scripts")
          PY

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Argentas-Comandas-debug
          path: app/build/outputs/apk/debug/app-debug.apk
