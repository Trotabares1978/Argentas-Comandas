<script>
(function(){
if(window.__ARGENTAS_BT_INSTALLED__)return;window.__ARGENTAS_BT_INSTALLED__=true;
function post(type,payload){try{window.dispatchEvent(new CustomEvent('argentas-bluetooth',{detail:{type:type,payload:payload}}));}catch(e){}}
window.onBluetoothState=function(s,m){post('state',{state:s,message:m||''});};
window.onBluetoothMessage=function(m){post('message',{message:String(m||'')});};
window.ArgentasBluetooth={
  startServer:function(){if(window.ArgentasNativeBluetooth)window.ArgentasNativeBluetooth.startServer();},
  refresh:function(){if(window.ArgentasNativeBluetooth)window.ArgentasNativeBluetooth.refresh();},
  connect:function(a){if(window.ArgentasNativeBluetooth)window.ArgentasNativeBluetooth.connect(String(a));},
  send:function(m){if(window.ArgentasNativeBluetooth)window.ArgentasNativeBluetooth.send(String(m));}
};
window.addEventListener('argentas-bluetooth',function(e){
 var d=e.detail||{},p=d.payload||{};
 if(d.type==='state'){
   var s=document.getElementById('argentas-bt-status');
   if(s)s.textContent=p.state+(p.message?' — '+p.message:'');
 }
 if(d.type==='devices'){
   var box=document.getElementById('argentas-bt-devices');
   if(!box)return;
   box.innerHTML='';
   var list=p.devices||[];
   if(!list.length){box.innerHTML='<div class="text-xs text-zinc-600">No hay otros Argentas abiertos en este momento.</div>';return;}
   list.forEach(function(x){
     var b=document.createElement('button');
     b.type='button';
     var name=x.name||'Argentas';
     b.textContent='📱 Argentas — '+name;
     b.style.cssText='display:block;width:100%;text-align:left;margin-top:8px;padding:14px 12px;border-radius:12px;background:#181818;border:1px solid #E8B84A;color:#fff;font-size:12px;font-weight:900;';
     b.onclick=function(){
       var ok=window.confirm('¿Querés conectar con Argentas — '+name+'?');
       if(!ok)return;
       b.textContent='⏳ Conectando…';
       b.disabled=true;
       if(window.ArgentasNativeBluetooth)window.ArgentasNativeBluetooth.connect(x.address);
     };
     box.appendChild(b);
   });
 }
 if(d.type==='message')console.log('ARGENTAS BT:',p.message||'');
});
})();
</script>
