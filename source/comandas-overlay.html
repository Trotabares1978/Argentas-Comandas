<style id="argentas-comandas-style">
#argentas-comandas-launcher{display:block;width:100%;background:#E8B84A;color:#0F0F0F;border:1px solid #000;border-radius:12px;padding:12px 14px;font:900 11px Inter,system-ui,sans-serif;letter-spacing:.08em;box-shadow:none;cursor:pointer;margin-top:8px}
#argentas-comandas-panel{position:fixed;inset:0;z-index:99999;background:#0F0F0F;color:#fff;display:none;font-family:Inter,system-ui,sans-serif;overflow:auto}
#argentas-comandas-panel.open{display:block}
.ac-wrap{max-width:760px;margin:auto;padding:18px 14px 90px}.ac-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.ac-title{font-weight:1000;font-size:22px;color:#E8B84A}.ac-sub{font-size:10px;color:#999;letter-spacing:.08em}.ac-tabs{display:flex;gap:5px;overflow:auto;background:#171717;border:1px solid #292929;border-radius:14px;padding:5px;margin-bottom:12px}.ac-tabs button{border:0;border-radius:10px;background:transparent;color:#aaa;padding:9px 10px;font-weight:900;font-size:10px}.ac-tabs button.on{background:#E8B84A;color:#111}.ac-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.ac-card{background:#181818;border:1px solid #303030;border-radius:13px;padding:12px}.ac-prod{background:#181818;border:1px solid #303030;border-radius:13px;padding:12px;text-align:left;color:#fff;min-height:64px}.ac-prod b{display:block;font-size:13px}.ac-prod span{display:block;color:#E8B84A;margin-top:5px;font-weight:900}.ac-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #2c2c2c}.ac-row:last-child{border-bottom:0}.ac-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.ac-btn{border:0;border-radius:9px;padding:9px 11px;font-weight:900;cursor:pointer}.ac-primary{background:#E8B84A;color:#111}.ac-ok{background:#35c46a;color:#07140b}.ac-dark{background:#303030;color:#fff}.ac-red{background:#d95757;color:#fff}.ac-total{text-align:right;font-size:22px;font-weight:1000;margin:12px 0}.ac-muted{color:#999;font-size:11px}.ac-badge{font-size:10px;padding:4px 7px;border-radius:99px;background:#3b321b;color:#f2cf68}.ac-badge.ok{background:#163a23;color:#7ce29a}
</style>
<button id="argentas-comandas-launcher" type="button">🧾 COMANDAS</button>
<div id="argentas-comandas-panel"><div class="ac-wrap">
<div class="ac-head"><div><div class="ac-title">ARGENTAS · COMANDAS</div><div class="ac-sub">MISMA IDENTIDAD · BLUETOOTH DIRECTO</div></div><button class="ac-btn ac-dark" id="ac-close">✕ Cerrar</button></div>
<div class="ac-tabs"><button class="on" data-ac-tab="nueva">Nueva</button><button data-ac-tab="lista">Comandas</button><button data-ac-tab="ventas">Ventas</button><button data-ac-tab="bt">Bluetooth</button></div>
<section id="ac-nueva"><div id="ac-grid" class="ac-grid"></div><div class="ac-card" style="margin-top:10px"><div class="ac-row"><b>Comanda <span id="ac-num"></span></b><button class="ac-btn ac-dark" id="ac-clear">Vaciar</button></div><div id="ac-draft" class="ac-muted" style="padding:18px 0;text-align:center">Agregá productos</div><div id="ac-total" class="ac-total">$0</div><button class="ac-btn ac-primary" id="ac-create">Crear comanda</button></div></section>
<section id="ac-lista" style="display:none"></section><section id="ac-ventas" style="display:none"></section>
<section id="ac-bt" style="display:none"><div class="ac-card"><b>Bluetooth directo</b><div class="ac-muted" style="margin-top:5px">Celular ↔ celular · sin Wi‑Fi, hotspot, internet ni servidor.</div><div class="ac-actions"><button class="ac-btn ac-dark" id="ac-wait">Esperar conexión</button><button class="ac-btn ac-dark" id="ac-refresh">Actualizar</button></div><div style="display:flex;gap:6px;margin-top:10px"><select id="ac-devices" style="flex:1;padding:9px;background:#111;color:#fff;border:1px solid #444;border-radius:9px"><option value="">Elegí teléfono emparejado</option></select><button class="ac-btn ac-primary" id="ac-connect">Conectar</button></div><div id="ac-btmsg" class="ac-muted" style="margin-top:8px">Emparejá ambos teléfonos desde Android.</div></div></section>
</div></div>
<script>(function(){'use strict';
var KEY='argentas_comandas_v2',db=load(),draft=[],connected=false,syncing=false;
function pushOrderToCaja(o){try{var raw=localStorage.getItem('argentas_sales'),sales=raw?JSON.parse(raw):[];if(!Array.isArray(sales))sales=[];if(sales.some(function(s){return s.comandaId===o.id}))return;var sale={id:'comanda-'+o.id,comandaId:o.id,fecha:new Date(o.createdAt||Date.now()).toISOString(),date:new Date(o.createdAt||Date.now()).toISOString(),items:o.lines.map(function(x){return{id:x.productId,name:x.name,qty:x.qty,price:x.price,total:x.qty*x.price}}),total:Number(o.total)||0,efectivo:0,transferencia:0,tipo:'comanda',paymentMethod:'Comanda',estadoComanda:o.status,origen:'Bluetooth'};sales.push(sale);localStorage.setItem('argentas_sales',JSON.stringify(sales))}catch(e){console.warn('No se pudo pasar la comanda a Caja',e)}}
function importOrdersToCaja(list){(list||[]).forEach(pushOrderToCaja)}
var defaults=[['p1','Superpancho común',3000],['p2','Superpancho alemán',4000],['p3','Hamburguesa simple',6000],['p4','Hamburguesa doble',8500],['p5','Combo Ganador simple',10000],['p6','Combo Ganador doble',12500],['p7','Milanesa',6500],['p8','Milanesa con queso',8500],['p9','Mila-Combo',10000],['p10','Mila-Combo con queso',12000],['p11','Salchi-Combo común',6500],['p12','Salchi-Combo Alemán',7500]].map(function(x){return{id:x[0],name:x[1],price:x[2],updatedAt:Date.now()};});
function load(){try{var d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.products)&&Array.isArray(d.orders))return d}catch(e){}return{products:defaults,orders:[],nextOrder:1,updatedAt:Date.now()}}
function save(){db.updatedAt=Date.now();localStorage.setItem(KEY,JSON.stringify(db))}
function p(id){return db.products.find(function(x){return x.id===id})}function money(n){return '$'+Number(n||0).toLocaleString('es-AR')}function sum(a){return a.reduce(function(s,x){return s+x.qty*x.price},0)}
function refreshProductsFromArgentas(){try{var raw=localStorage.getItem('argentas_products_v6');if(!raw)return;var list=JSON.parse(raw);if(!Array.isArray(list))return;var now=Date.now();var mapped=list.filter(function(x){return x.active!==false}).map(function(x){return{id:String(x.id),name:String(x.name),price:Number(x.price)||0,updatedAt:Number(x.updatedAt)||now}});if(mapped.length)db.products=mapped}catch(e){}}\nfunction renderNew(){document.getElementById('ac-num').textContent='#'+db.nextOrder;document.getElementById('ac-grid').innerHTML=db.products.map(function(x){return '<button class="ac-prod" data-p="'+x.id+'"><b>'+x.name+'</b><span>'+money(x.price)+'</span></button>'}).join('');document.querySelectorAll('#ac-grid [data-p]').forEach(function(b){b.onclick=function(){add(b.getAttribute('data-p'))}});renderDraft()}
function add(id){var x=p(id),l=draft.find(function(y){return y.productId===id});if(l)l.qty++;else draft.push({productId:id,name:x.name,price:x.price,qty:1});renderDraft()}
function renderDraft(){var e=document.getElementById('ac-draft');if(!draft.length){e.textContent='Agregá productos';e.className='ac-muted';e.style.textAlign='center';document.getElementById('ac-total').textContent='$0';return}e.className='';e.style.textAlign='left';e.innerHTML=draft.map(function(x,i){return '<div class="ac-row"><span>'+x.qty+' × '+x.name+'</span><span>'+money(x.qty*x.price)+' <button class="ac-btn ac-dark" data-i="'+i+'" data-d="-1">−</button><button class="ac-btn ac-dark" data-i="'+i+'" data-d="1">+</button></span></div>'}).join('');e.querySelectorAll('[data-i]').forEach(function(b){b.onclick=function(){var i=Number(b.dataset.i),d=Number(b.dataset.d);draft[i].qty+=d;if(draft[i].qty<=0)draft.splice(i,1);renderDraft()}});document.getElementById('ac-total').textContent=money(sum(draft))}
function createOrder(){if(!draft.length)return;var now=Date.now(),n=db.nextOrder++;while(db.orders.some(function(o){return Number(o.number)===Number(n)}))n=db.nextOrder++;db.orders.unshift({id:'o'+now+Math.random().toString(36).slice(2,7),number:n,lines:JSON.parse(JSON.stringify(draft)),total:sum(draft),status:'pendiente',paid:false,createdAt:now,updatedAt:now});draft=[];save();renderAll();sync()}
function label(s){return{pendiente:'Pendiente',preparando:'Preparando',lista:'Lista',entregada:'Entregada',cancelada:'Anulada'}[s]||s}
function renderOrders(){var e=document.getElementById('ac-lista');if(!db.orders.length){e.innerHTML='<div class="ac-card">No hay comandas.</div>';return}e.innerHTML=db.orders.map(function(o){return '<div class="ac-card" style="margin-bottom:9px"><div class="ac-row"><b style="font-size:18px">#'+o.number+' <span class="ac-badge '+(o.status==='entregada'?'ok':'')+'">'+label(o.status)+'</span></b><b>'+money(o.total)+'</b></div><div class="ac-muted">'+o.lines.map(function(x){return x.qty+'× '+x.name}).join(' · ')+'</div><div class="ac-actions">'+(o.status==='pendiente'?'<button class="ac-btn ac-dark" data-st="'+o.id+'|preparando">👨‍🍳 Preparar</button>':'')+(o.status==='preparando'?'<button class="ac-btn ac-primary" data-st="'+o.id+'|lista">✅ Lista</button>':'')+(o.status==='lista'?'<button class="ac-btn ac-ok" data-st="'+o.id+'|entregada">📦 Entregada</button>':'')+(o.status!=='entregada'&&o.status!=='cancelada'?'<button class="ac-btn ac-dark" data-pay="'+o.id+'">'+(o.paid?'💵 Pagada':'💰 Cobrar')+'</button>':'')+(o.status!=='entregada'&&o.status!=='cancelada'?'<button class="ac-btn ac-red" data-cancel="'+o.id+'">Anular</button>':'')+'</div></div>'}).join('');e.querySelectorAll('[data-st]').forEach(function(b){b.onclick=function(){var z=b.dataset.st.split('|');setStatus(z[0],z[1])}});e.querySelectorAll('[data-pay]').forEach(function(b){b.onclick=function(){togglePaid(b.dataset.pay)}});e.querySelectorAll('[data-cancel]').forEach(function(b){b.onclick=function(){setStatus(b.dataset.cancel,'cancelada')}})}
function setStatus(id,s){var o=db.orders.find(function(x){return x.id===id});if(!o)return;o.status=s;o.updatedAt=Date.now();save();renderAll();sync()}
function togglePaid(id){var o=db.orders.find(function(x){return x.id===id});if(!o)return;o.paid=!o.paid;o.updatedAt=Date.now();save();renderAll();sync()}
function renderSales(){var a=db.orders.filter(function(o){return o.status!=='cancelada'}),v=a.reduce(function(s,o){return s+o.total},0),c=a.filter(function(o){return o.paid}).reduce(function(s,o){return s+o.total},0);document.getElementById('ac-ventas').innerHTML='<div class="ac-card"><div class="ac-row"><span>Ventas</span><b>'+money(v)+'</b></div><div class="ac-row"><span>Cobrado</span><b>'+money(c)+'</b></div><div class="ac-row"><span>Deuda</span><b>'+money(v-c)+'</b></div><div class="ac-row"><span>Comandas</span><b>'+a.length+'</b></div></div>'}
function renderAll(){refreshProductsFromArgentas();renderNew();renderOrders();renderSales();importOrdersToCaja(db.orders)}
function sync(){if(syncing)return;if(connected&&window.ArgentasNativeBluetooth)window.ArgentasNativeBluetooth.send(JSON.stringify({type:'state',db:db}))}
function merge(remote){if(!remote)return;syncing=true;var om=new Map(db.orders.map(function(x){return[x.id,x]}));(remote.orders||[]).forEach(function(x){var l=om.get(x.id);if(!l||Number(x.updatedAt)>Number(l.updatedAt))om.set(x.id,x)});db.orders=Array.from(om.values()).sort(function(a,b){return b.number-a.number});importOrdersToCaja(db.orders);var pm=new Map(db.products.map(function(x){return[x.id,x]}));(remote.products||[]).forEach(function(x){var l=pm.get(x.id);if(!l||Number(x.updatedAt)>Number(l.updatedAt))pm.set(x.id,x)});db.products=Array.from(pm.values());db.nextOrder=Math.max(db.nextOrder,remote.nextOrder||1,db.orders.reduce(function(m,o){return Math.max(m,o.number+1)},1));save();renderAll();syncing=false}
window.onBluetoothState=function(s,m){connected=s==='CONECTADO';document.getElementById('ac-btmsg').textContent=m||s;if(connected)sync()}
window.onBluetoothMessage=function(raw){raw.trim().split('\n').filter(Boolean).forEach(function(line){try{var m=JSON.parse(line);if(m.type==='state'||m.type==='hello')merge(m.db)}catch(e){}})}
window.addEventListener('argentas-bluetooth',function(e){if(!e.detail||e.detail.type!=='devices')return;var s=document.getElementById('ac-devices');s.innerHTML='<option value="">Elegí teléfono emparejado</option>';(e.detail.payload.devices||[]).forEach(function(x){var o=document.createElement('option');o.value=x.address;o.textContent=x.name+' — '+x.address;s.appendChild(o)})});
document.getElementById('argentas-comandas-launcher').onclick=function(){document.getElementById('argentas-comandas-panel').classList.add('open');refreshProductsFromArgentas();renderAll()};
document.getElementById('ac-close').onclick=function(){document.getElementById('argentas-comandas-panel').classList.remove('open')};document.getElementById('ac-clear').onclick=function(){draft=[];renderDraft()};document.getElementById('ac-create').onclick=createOrder;
document.getElementById('ac-wait').onclick=function(){if(window.ArgentasNativeBluetooth)window.ArgentasNativeBluetooth.startServer()};document.getElementById('ac-refresh').onclick=function(){if(window.ArgentasNativeBluetooth)window.ArgentasNativeBluetooth.refresh()};document.getElementById('ac-connect').onclick=function(){var v=document.getElementById('ac-devices').value;if(v&&window.ArgentasNativeBluetooth)window.ArgentasNativeBluetooth.connect(v)};
document.querySelectorAll('#argentas-comandas-panel .ac-tabs button').forEach(function(b){b.onclick=function(){document.querySelectorAll('#argentas-comandas-panel .ac-tabs button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');['nueva','lista','ventas','bt'].forEach(function(x){document.getElementById('ac-'+x).style.display=x===b.dataset.acTab?'block':'none'});renderAll()}});
})();
</script>
