<script>(function(){'use strict';
var KEY='argentas_comandas_v2',db=load(),draft=[],connected=false,syncing=false,pendingPaymentId=null,lastAction=null;
var importedVenderSales={};
function registerVenderDraft(s){if(!s||!s.id)return false;var id='v'+String(s.id),existing=db.orders.find(function(o){return o.id===id});if(existing&&(existing.status==='entregada'||existing.status==='cancelada'||existing.status==='oculta'||existing.status==='lista')){var incomingAt=s.timestamp?new Date(s.timestamp).getTime():0;if(!incomingAt||incomingAt<=Number(existing.updatedAt||existing.createdAt||0))return false;s=Object.assign({},s,{id:Math.random().toString(36).slice(2,12)});id='v'+String(s.id);existing=null;window.argentasPendingComandaId=s.id;try{localStorage.setItem('argentas_vender_draft',JSON.stringify(s))}catch(_){}}var lines=(s.items||[]).map(function(x){return{productId:String(x.productId||x.id||''),name:String(x.name||''),price:Number(x.price)||0,qty:Number(x.qty)||0}}).filter(function(x){return x.qty>0});if(existing){if(!lines.length){var ei=db.orders.indexOf(existing);if(ei>=0)db.orders.splice(ei,1);save();renderAll();sync();return true}existing.lines=lines;existing.total=Number(s.total)||0;existing.updatedAt=Date.now();save();renderAll();sync();return true}if(!lines.length)return false;var now=Date.now(),day=todayKey(),n=nextDailyNumber(day);db.orders.unshift({id:id,number:n,day:day,lines:lines,total:Number(s.total)||0,status:'recibido',paid:false,paymentMethod:null,createdAt:s.timestamp?new Date(s.timestamp).getTime():now,updatedAt:now,source:'vender'});save();renderAll();sync();return true}
function registerVenderSale(s){if(!s||!s.id||!s.comandaId)return false;var id='v'+String(s.comandaId),existing=db.orders.find(function(o){return o.id===id});if(!existing)return false;var lines=(s.items||existing.lines||[]).map(function(x){return{productId:String(x.productId||x.id||''),name:String(x.name||''),price:Number(x.price)||0,qty:Number(x.qty)||0,note:String(x.note||'')}}).filter(function(x){return x.qty>0});if(JSON.stringify(existing.lines||[])===JSON.stringify(lines)&&Number(existing.total||0)===Number(s.total||existing.total||0))return false;existing.lines=lines;existing.total=Number(s.total)||existing.total||0;existing.updatedAt=Date.now();save();renderAll();sync();return true}
function importNewVenderSales(){try{var a=JSON.parse(localStorage.getItem('argentas_sales')||'[]');if(!Array.isArray(a))return;a.forEach(function(s){registerVenderSale(s)})}catch(e){console.warn('No se pudieron importar ventas a Comandas',e)}}
function pushOrderToCaja(o){try{var raw=localStorage.getItem('argentas_sales'),sales=raw?JSON.parse(raw):[];if(!Array.isArray(sales))sales=[];var sale=sales.find(function(s){return s.comandaId===o.id}),now=new Date(o.createdAt||Date.now()).toISOString();if(!sale){sale={id:'comanda-'+o.id,comandaId:o.id,fecha:now,date:now,items:[],total:0,efectivo:0,transferencia:0,tipo:'comanda',paymentMethod:'Pendiente',estadoComanda:o.status,origen:'Bluetooth',updatedAt:Date.now()};sales.push(sale)}var items=o.lines.map(function(x){return{id:x.productId,name:x.name,qty:x.qty,price:x.price,total:x.qty*x.price}}),next={fecha:now,date:now,items:items,total:Number(o.total)||0,estadoComanda:o.status};if(o.paid){next.paymentMethod=o.paymentMethod==='Transferencia'?'Transferencia':'Efectivo';next.efectivo=next.paymentMethod==='Efectivo'?next.total:0;next.transferencia=next.paymentMethod==='Transferencia'?next.total:0;next.tipo=next.paymentMethod.toLowerCase()}else{next.paymentMethod='Pendiente';next.efectivo=0;next.transferencia=0;next.tipo='comanda'}var changed=!sale||JSON.stringify({fecha:sale.fecha,date:sale.date,items:sale.items,total:sale.total,estadoComanda:sale.estadoComanda,paymentMethod:sale.paymentMethod,efectivo:sale.efectivo,transferencia:sale.transferencia,tipo:sale.tipo})!==JSON.stringify(next);if(!changed)return false;Object.assign(sale,next,{updatedAt:Date.now()});localStorage.setItem('argentas_sales',JSON.stringify(sales));return true}catch(e){console.warn('No se pudo pasar la comanda a Caja',e);return false}}
function importOrdersToCaja(list){(list||[]).forEach(pushOrderToCaja)}
var defaults=[['p1','Superpancho común',3000],['p2','Superpancho alemán',4000],['p3','Hamburguesa simple',6000],['p4','Hamburguesa doble',8500],['p5','Combo Ganador simple',10000],['p6','Combo Ganador doble',12500],['p7','Milanesa',6500],['p8','Milanesa con queso',8500],['p9','Mila-Combo',10000],['p10','Mila-Combo con queso',12000],['p11','Salchi-Combo común',6500],['p12','Salchi-Combo Alemán',7500]].map(function(x){return{id:x[0],name:x[1],price:x[2],updatedAt:Date.now()};});
function load(){try{var d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.products)&&Array.isArray(d.orders)){var migrated=!Number(d.stateVersion)||Number(d.stateVersion)<4;d.orders.forEach(function(o){if(o.status==='pendiente')o.status='recibido';if(!o.day){var dt=new Date(Number(o.createdAt)||Date.now());o.day=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0')}if(migrated&&o.status!=='entregada'&&o.status!=='cancelada'&&o.status!=='oculta')o.status='recibido'});d.stateVersion=4;return d}}catch(e){}return{products:defaults,orders:[],nextOrder:1,stateVersion:4,updatedAt:Date.now()}}
function save(){db.updatedAt=Date.now();localStorage.setItem(KEY,JSON.stringify(db))}
function rememberAction(a){lastAction=a;renderUndo()}
function renderUndo(){var b=document.getElementById('ac-undo');if(!b)return;b.disabled=!lastAction;b.style.opacity=lastAction?'1':'.45';b.textContent=lastAction?'↶ Deshacer: '+lastAction.label:'↶ Deshacer'}
function undo(){if(!lastAction)return;var a=lastAction,o=db.orders.find(function(x){return x.id===a.id});if(a.type==='status'&&o){o.status=a.from;o.updatedAt=Date.now();save();lastAction=null;renderAll();sync();return}if(a.type==='create'&&o){var i=db.orders.indexOf(o);if(i>=0)db.orders.splice(i,1);save();lastAction=null;renderAll();sync();return}if(a.type==='hide'&&o){o.status='entregada';o.updatedAt=Date.now();save();lastAction=null;renderAll();sync()}}
function p(id){return db.products.find(function(x){return x.id===id})}function money(n){return '$'+Number(n||0).toLocaleString('es-AR')}function sum(a){return a.reduce(function(s,x){return s+x.qty*x.price},0)}
function refreshProductsFromArgentas(){try{var raw=localStorage.getItem('argentas_products_v6');if(!raw)return;var list=JSON.parse(raw);if(!Array.isArray(list))return;var now=Date.now();var mapped=list.filter(function(x){return x.active!==false}).map(function(x){return{id:String(x.id),name:String(x.name),price:Number(x.price)||0,updatedAt:Number(x.updatedAt)||now}});if(mapped.length)db.products=mapped}catch(e){}}
function renderNew(){document.getElementById('ac-num').textContent='#'+nextDailyNumber(todayKey());document.getElementById('ac-grid').innerHTML=db.products.map(function(x){return '<button class="ac-prod" data-p="'+x.id+'"><b>'+x.name+'</b><span>'+money(x.price)+'</span></button>'}).join('');document.querySelectorAll('#ac-grid [data-p]').forEach(function(b){b.onclick=function(){add(b.getAttribute('data-p'))}});renderDraft()}
function add(id){var x=p(id),l=draft.find(function(y){return y.productId===id});if(l)l.qty++;else draft.push({productId:id,name:x.name,price:x.price,qty:1});renderDraft()}
function renderDraft(){var e=document.getElementById('ac-draft');if(!draft.length){e.textContent='Agregá productos';e.className='ac-muted';e.style.textAlign='center';document.getElementById('ac-total').textContent='$0';return}e.className='';e.style.textAlign='left';e.innerHTML=draft.map(function(x,i){return '<div class="ac-row"><span>'+x.qty+' × '+x.name+'</span><span>'+money(x.qty*x.price)+' <button class="ac-btn ac-dark" data-i="'+i+'" data-d="-1">−</button><button class="ac-btn ac-dark" data-i="'+i+'" data-d="1">+</button></span></div>'}).join('');e.querySelectorAll('[data-i]').forEach(function(b){b.onclick=function(){var i=Number(b.dataset.i),d=Number(b.dataset.d);draft[i].qty+=d;if(draft[i].qty<=0)draft.splice(i,1);renderDraft()}});document.getElementById('ac-total').textContent=''}
function createOrder(){if(!draft.length)return;var now=Date.now(),day=todayKey(),n=nextDailyNumber(day),id='o'+now+Math.random().toString(36).slice(2,7);db.orders.unshift({id:id,number:n,day:day,lines:JSON.parse(JSON.stringify(draft)),total:sum(draft),status:'recibido',paid:false,createdAt:now,updatedAt:now});draft=[];save();rememberAction({type:'create',id:id,label:'crear comanda #'+n});renderAll();sync()}
function todayKey(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function nextDailyNumber(day){var nums=db.orders.filter(function(o){return String(o.day||'')===day}).map(function(o){return Number(o.number)||0});return (nums.length?Math.max.apply(null,nums):0)+1}
function label(s){return{recibido:'Recibido',preparando:'En preparación',entregada:'Entregado'}[s]||'Pendiente'}
function renderOrders(){var e=document.getElementById('ac-lista'),visible=db.orders.filter(function(o){return o.status!=='cancelada'&&o.status!=='oculta'});if(!visible.length){e.innerHTML='<div class="ac-card">No hay comandas pendientes.</div>';return}e.innerHTML='<div class="ac-list-grid">'+visible.map(function(o){var lines=Array.isArray(o.lines)?o.lines:[],done=o.status==='entregada';return '<div class="ac-card" data-order-tap="'+o.id+'" style="margin-bottom:9px;cursor:pointer;'+(done?'opacity:.9':'')+'"><div class="ac-row"><b style="font-size:18px">#'+o.number+' <span class="ac-badge '+(done?'ok':'')+'">'+label(o.status)+'</span></b></div><div style="margin-top:10px;font-weight:1000;font-size:11px;letter-spacing:.08em;color:#E8B84A">INCLUYE</div><div style="margin-top:5px;border-top:1px solid #2c2c2c">'+(lines.length?lines.map(function(x){return '<div class="ac-row"><span style="font-weight:800">'+x.qty+' × '+x.name+(x.note?' <span class="ac-muted">('+x.note+')</span>':'')+'</span></div>'}).join(''):'<div class="ac-muted" style="padding:10px 0">Sin detalle de productos</div>')+'</div><div class="ac-actions"><span class="ac-muted">'+(done?'Tocá para quitarla de la lista':'Tocá la comanda para avanzar')+'</span></div></div>'}).join('')+'</div>';e.querySelectorAll('[data-order-tap]').forEach(function(card){card.onclick=function(){var id=card.getAttribute('data-order-tap'),o=db.orders.find(function(x){return x.id===id});if(!o)return;if(o.status==='recibido')setStatus(id,'preparando');else if(o.status==='preparando')setStatus(id,'entregada');else if(o.status==='entregada')setStatus(id,'oculta')}})}
function setStatus(id,s){if(s!=='recibido'&&s!=='preparando'&&s!=='entregada'&&s!=='oculta')return;var o=db.orders.find(function(x){return x.id===id});if(!o)return;var from=o.status;o.status=s;o.updatedAt=Date.now();save();rememberAction({type:s==='oculta'?'hide':'status',id:id,from:from,label:'marcar #'+o.number+' como '+label(s)});renderAll();sync()}
function togglePaid(id){var o=db.orders.find(function(x){return x.id===id});if(!o)return;if(o.paid){o.paid=false;o.paymentMethod=null;o.updatedAt=Date.now();save();renderAll();sync();return}pendingPaymentId=id;var m=document.getElementById('ac-pay-modal');var info=document.getElementById('ac-pay-info');if(info)info.textContent='Comanda #'+o.number+' · '+money(o.total);if(m)m.classList.add('open')}
function renderSales(){document.getElementById('ac-ventas').innerHTML=''}
function renderAll(){refreshProductsFromArgentas();renderNew();renderOrders();renderSales();importOrdersToCaja(db.orders);renderUndo()}
/* Respaldo: si la venta ya fue guardada en localStorage, también la detectamos. */
function importVenderDraftFromStorage(){try{var raw=localStorage.getItem("argentas_vender_draft");if(raw){registerVenderDraft(JSON.parse(raw))}else{window.argentasPendingComandaId=null}}catch(e){console.warn("No se pudo leer el pedido en curso de VENDER",e)}}
setInterval(function(){importVenderDraftFromStorage();importNewVenderSales()},300);
window.addEventListener('argentas-vender-draft',function(e){try{var d=e.detail;if(d&&d.id){var oldId='v'+String(d.id),old=db.orders.find(function(o){return o.id===oldId});if(old&&(old.status==='entregada'||old.status==='cancelada')){var fresh=Math.random().toString(36).slice(2,12);d=Object.assign({},d,{id:fresh});e.detail=d;window.argentasPendingComandaId=fresh;try{localStorage.setItem('argentas_vender_draft',JSON.stringify(d))}catch(_){}}}registerVenderDraft(d)}catch(err){console.warn('No se pudo recibir el pedido de VENDER',err)}});window.addEventListener('argentas-vender-cancel-draft',function(e){try{localStorage.removeItem('argentas_vender_draft');window.argentasPendingComandaId=null;var id='v'+String(e.detail&&e.detail.id||'');var i=db.orders.findIndex(function(o){return o.id===id&&o.source==='vender'&&!o.paid});if(i>=0){db.orders.splice(i,1);save();renderAll();sync()}}catch(err){console.warn('No se pudo cancelar el pedido de VENDER',err)}});window.addEventListener('argentas-vender-sale',function(e){try{registerVenderSale(e.detail)}catch(err){console.warn('No se pudo recibir la venta de VENDER',err)}});
function salesSnapshot(){try{var s=JSON.parse(localStorage.getItem('argentas_sales')||'[]');return Array.isArray(s)?s:[]}catch(e){return[]}}
function mergeSales(remote){var local=salesSnapshot(),map=new Map(local.map(function(s){return[String(s.id||s.comandaId||JSON.stringify(s)),s]}));(remote||[]).forEach(function(s){var key=String(s.id||s.comandaId||JSON.stringify(s)),l=map.get(key);if(!l||Number(s.updatedAt||0)>Number(l.updatedAt||0))map.set(key,s)});var merged=Array.from(map.values());try{localStorage.setItem('argentas_sales',JSON.stringify(merged))}catch(e){console.warn('No se pudieron guardar ventas sincronizadas',e)}}
function sync(){if(syncing)return;if(connected&&window.ArgentasNativeBluetooth)window.ArgentasNativeBluetooth.send(JSON.stringify({type:'state',db:db,sales:salesSnapshot()}))}
function merge(remote){if(!remote)return;syncing=true;mergeSales(remote.sales||[]);var om=new Map(db.orders.map(function(x){return[x.id,x]}));(remote.orders||[]).forEach(function(x){var l=om.get(x.id);if(!l||Number(x.updatedAt)>Number(l.updatedAt))om.set(x.id,x)});db.orders=Array.from(om.values()).sort(function(a,b){return b.number-a.number});importOrdersToCaja(db.orders);var pm=new Map(db.products.map(function(x){return[x.id,x]}));(remote.products||[]).forEach(function(x){var l=pm.get(x.id);if(!l||Number(x.updatedAt)>Number(l.updatedAt))pm.set(x.id,x)});db.products=Array.from(pm.values());db.nextOrder=Math.max(db.nextOrder,remote.nextOrder||1,db.orders.reduce(function(m,o){return Math.max(m,o.number+1)},1));save();renderAll();syncing=false;sync()}
window.onBluetoothState=function(s,m){connected=s==='CONECTADO';document.getElementById('ac-btmsg').textContent=m||s;if(connected)sync()}
window.onBluetoothMessage=function(raw){raw.trim().split('\n').filter(Boolean).forEach(function(line){try{var m=JSON.parse(line);if(m.type==='state'||m.type==='hello')merge(m.db)}catch(e){}})}
window.addEventListener('argentas-bluetooth',function(e){if(!e.detail||e.detail.type!=='devices')return;var s=document.getElementById('ac-devices');s.innerHTML='<option value="">Elegí teléfono emparejado</option>';(e.detail.payload.devices||[]).forEach(function(x){var o=document.createElement('option');o.value=x.address;o.textContent=x.name+' — '+x.address;s.appendChild(o)})});
function openArgentasComandas(){var p=document.getElementById('argentas-comandas-panel');if(!p)return;p.classList.add('open');refreshProductsFromArgentas();importVenderDraftFromStorage();importNewVenderSales();renderAll();var listTab=document.querySelector('#argentas-comandas-panel .ac-tabs button[data-ac-tab="lista"]');if(listTab)listTab.click()}document.getElementById('argentas-comandas-launcher').onclick=openArgentasComandas;document.getElementById('argentas-comandas-mobile-tab').onclick=openArgentasComandas;window.addEventListener('open-argentas-comandas',openArgentasComandas);window.openArgentasComandas=openArgentasComandas;document.addEventListener('click',function(e){var b=e.target&&e.target.closest&&e.target.closest('#argentas-comandas-mobile-tab,#argentas-comandas-launcher');if(b){e.preventDefault();e.stopPropagation();openArgentasComandas()}},true);
document.getElementById('ac-undo').onclick=undo;document.getElementById('ac-close').onclick=function(){document.getElementById('argentas-comandas-panel').classList.remove('open')};document.getElementById('ac-clear').onclick=function(){draft=[];renderDraft()};document.getElementById('ac-create').onclick=createOrder;
document.getElementById('ac-wait').onclick=function(){if(window.ArgentasNativeBluetooth)window.ArgentasNativeBluetooth.startServer()};document.getElementById('ac-refresh').onclick=function(){if(window.ArgentasNativeBluetooth)window.ArgentasNativeBluetooth.refresh()};document.getElementById('ac-connect').onclick=function(){var v=document.getElementById('ac-devices').value;if(v&&window.ArgentasNativeBluetooth)window.ArgentasNativeBluetooth.connect(v)};
document.querySelectorAll('#argentas-comandas-panel .ac-tabs button').forEach(function(b){b.onclick=function(){document.querySelectorAll('#argentas-comandas-panel .ac-tabs button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');['nueva','lista','ventas','bt'].forEach(function(x){document.getElementById('ac-'+x).style.display=x===b.dataset.acTab?'block':'none'});renderAll()}});
})();
