<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Argentas-Comandas</title>
<style>
:root{--bg:#101010;--card:#1d1d1d;--line:#333;--gold:#e8b84a;--ok:#35c46a;--muted:#aaa;--red:#d95757}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.brand{font-size:24px;font-weight:900}.conn{font-size:12px;color:var(--muted)}.tabs{display:flex;gap:6px;overflow:auto;margin:14px 0}.tabs button{white-space:nowrap;background:#292929;color:#fff;border:0;border-radius:9px;padding:10px;font-weight:700}.tabs button.active{background:var(--gold);color:#111}.panel{display:none}.panel.active{display:block}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.prod,.card,.order{background:var(--card);border:1px solid var(--line);border-radius:13px}.prod{padding:12px;text-align:left;color:#fff}.prod b{display:block}.prod span{display:block;color:var(--gold);margin-top:5px}.card,.order{padding:12px;margin:10px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #2d2d2d}.row:last-child{border:0}.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}button{border:0;border-radius:9px;padding:9px 11px;font-weight:700}button.primary{background:var(--gold);color:#111}button.ok{background:var(--ok);color:#07140b}button.dark{background:#303030;color:#fff}button.red{background:var(--red);color:#fff}.total{font-size:22px;font-weight:900;text-align:right;margin:12px 0}.empty{text-align:center;color:var(--muted);padding:25px}.small{font-size:12px;color:var(--muted)}.badge{font-size:11px;padding:4px 7px;border-radius:99px;background:#3b321b;color:#f2cf68}.badge.ok{background:#163a23;color:#7ce29a}.device{display:flex;gap:7px;margin-top:10px}.device select{flex:1;padding:10px;border-radius:9px;background:#111;color:#fff;border:1px solid #444}.edit{display:grid;grid-template-columns:1fr 110px auto;gap:6px;align-items:center}.edit input{width:100%;padding:8px;background:#111;color:#fff;border:1px solid #444;border-radius:7px}@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}#toast{display:none;position:fixed;bottom:15px;left:12px;right:12px;padding:12px;background:#eee;color:#111;border-radius:10px;text-align:center;font-weight:700}
</style></head><body><div class="wrap">
<div class="top"><div class="brand">ARGENTAS-COMANDAS</div><div id="conn" class="conn">Bluetooth: desconectado</div></div>
<div class="tabs"><button class="active" data-tab="new">Nueva</button><button data-tab="orders">Comandas</button><button data-tab="sales">Ventas</button><button data-tab="products">Productos</button><button data-tab="bt">Bluetooth</button></div>
<section id="new" class="panel active"><div id="grid" class="grid"></div><div class="card"><div><b>Comanda <span id="num"></span></b><button class="dark" style="float:right" onclick="draft=[];renderDraft()">Vaciar</button></div><div id="draft" class="empty">Agregá productos</div><div id="draftTotal" class="total">$0</div><button class="primary" onclick="createOrder()">Crear comanda</button></div></section>
<section id="orders" class="panel"><div id="ordersList"></div></section>
<section id="sales" class="panel"><div id="salesBox"></div></section>
<section id="products" class="panel"><div class="card"><b>Productos y precios</b><p class="small">Los cambios se sincronizan por Bluetooth.</p><div id="editor"></div></div></section>
<section id="bt" class="panel"><div class="card"><b>Bluetooth directo</b><p class="small">Sin Wi‑Fi, hotspot, internet ni servidor.</p><div class="actions"><button onclick="waitBT()">Esperar conexión</button><button onclick="refreshBT()">Actualizar</button></div><div class="device"><select id="devices"><option value="">Elegí teléfono emparejado</option></select><button onclick="connectBT()">Conectar</button></div><p id="btmsg" class="small">Emparejá ambos teléfonos desde Android.</p></div></section>
</div><div id="toast"></div>
<script>
const KEY='argentas_comandas_v2';
const defaults=[['p1','Superpancho común',3000],['p2','Superpancho alemán',4000],['p3','Hamburguesa simple',6000],['p4','Hamburguesa doble',8500],['p5','Combo Ganador simple',10000],['p6','Combo Ganador doble',12500],['p7','Milanesa',6500],['p8','Milanesa con queso',8500],['p9','Mila-Combo',10000],['p10','Mila-Combo con queso',12000],['p11','Salchi-Combo común',6500],['p12','Salchi-Combo Alemán',7500]].map(x=>({id:x[0],name:x[1],price:x[2],updatedAt:Date.now()}));
let db=load(),draft=[],connected=false;
function load(){try{let d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.products)&&Array.isArray(d.orders))return d}catch(e){}return{products:defaults,orders:[],nextOrder:1,updatedAt:Date.now()}}
function save(){db.updatedAt=Date.now();localStorage.setItem(KEY,JSON.stringify(db))}
function p(id){return db.products.find(x=>x.id===id)}function money(n){return '$'+Number(n||0).toLocaleString('es-AR')}function sum(a){return a.reduce((s,x)=>s+x.qty*x.price,0)}
function toast(s){let e=document.getElementById('toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',1600)}
function renderProducts(){grid.innerHTML=db.products.map(x=>'<button class="prod" onclick="add(\''+x.id+'\')"><b>'+x.name+'</b><span>'+money(x.price)+'</span></button>').join('')}
function add(id){let x=p(id),l=draft.find(y=>y.productId===id);if(l)l.qty++;else draft.push({productId:id,name:x.name,price:x.price,qty:1});renderDraft()}
function renderDraft(){num.textContent='#'+db.nextOrder;if(!draft.length){draft.innerHTML='Agregá productos';draft.className='empty';draftTotal.textContent='$0';return}draft.className='';draft.innerHTML=draft.map((x,i)=>'<div class="row"><span>'+x.qty+' × '+x.name+'</span><span>'+money(x.qty*x.price)+' <button class="dark" onclick="chg('+i+',-1)">−</button><button class="dark" onclick="chg('+i+',1)">+</button></span></div>').join('');draftTotal.textContent=money(sum(draft))}
function chg(i,d){draft[i].qty+=d;if(draft[i].qty<=0)draft.splice(i,1);renderDraft()}
function createOrder(){if(!draft.length)return toast('La comanda está vacía');let now=Date.now();db.orders.unshift({id:'o'+now+Math.random().toString(36).slice(2,7),number:db.nextOrder++,lines:JSON.parse(JSON.stringify(draft)),total:sum(draft),status:'pendiente',paid:false,createdAt:now,updatedAt:now});draft=[];save();render();sync();toast('Comanda #'+(db.nextOrder-1)+' creada')}
function status(s){return{pendiente:'Pendiente',preparando:'Preparando',lista:'Lista',entregada:'Entregada',cancelada:'Anulada'}[s]||s}
function renderOrders(){if(!db.orders.length){ordersList.innerHTML='<div class="empty">No hay comandas.</div>';return}ordersList.innerHTML=db.orders.map(o=>'<div class="order"><div class="row"><b style="font-size:19px">#'+o.number+' <span class="badge '+(o.status==='entregada'?'ok':'')+'">'+status(o.status)+'</span></b><b>'+money(o.total)+'</b></div><div class="small">'+o.lines.map(x=>x.qty+'× '+x.name).join(' · ')+'</div><div class="actions">'+(o.status==='pendiente'?'<button onclick="st(\''+o.id+'\',\'preparando\')">👨‍🍳 Preparar</button>':'')+(o.status==='preparando'?'<button class="primary" onclick="st(\''+o.id+'\',\'lista\')">✅ Lista</button>':'')+(o.status==='lista'?'<button class="ok" onclick="st(\''+o.id+'\',\'entregada\')">📦 Entregada</button>':'')+(o.status!=='entregada'&&o.status!=='cancelada'?'<button class="dark" onclick="pay(\''+o.id+'\')">'+(o.paid?'💵 Pagada':'💰 Cobrar')+'</button>':'')+(o.status!=='cancelada'&&o.status!=='entregada'?'<button class="red" onclick="cancelO(\''+o.id+'\')">Anular</button>':'')+'</div></div>').join('')}
function st(id,s){let o=db.orders.find(x=>x.id===id);if(!o)return;o.status=s;o.updatedAt=Date.now();save();renderOrders();renderSales();sync()}
function pay(id){let o=db.orders.find(x=>x.id===id);if(!o)return;o.paid=!o.paid;o.updatedAt=Date.now();save();renderOrders();renderSales();sync()}
function cancelO(id){if(!confirm('¿Anular esta comanda?'))return;st(id,'cancelada')}
function renderSales(){let a=db.orders.filter(o=>o.status!=='cancelada'),v=a.reduce((s,o)=>s+o.total,0),c=a.filter(o=>o.paid).reduce((s,o)=>s+o.total,0);salesBox.innerHTML='<div class="card"><div class="row"><span>Ventas</span><b>'+money(v)+'</b></div><div class="row"><span>Cobrado</span><b>'+money(c)+'</b></div><div class="row"><span>Deuda</span><b>'+money(v-c)+'</b></div><div class="row"><span>Comandas</span><b>'+a.length+'</b></div></div>'+a.map(o=>'<div class="card">#'+o.number+' · '+status(o.status)+' · '+(o.paid?'Pagada':'Sin cobrar')+' <b style="float:right">'+money(o.total)+'</b></div>').join('')}
function renderEditor(){editor.innerHTML=db.products.map(x=>'<div class="row"><b>'+x.name+'</b><div class="edit"><input id="v_'+x.id+'" type="number" value="'+x.price+'"><button class="primary" onclick="price(\''+x.id+'\')">Guardar</button></div></div>').join('')}
function price(id){let x=p(id),v=Number(document.getElementById('v_'+id).value);if(!x||!isFinite(v)||v<0)return;x.price=v;x.updatedAt=Date.now();save();render();sync();toast('Precio actualizado')}
function render(){renderProducts();renderDraft();renderOrders();renderSales();renderEditor()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.getElementById(b.dataset.tab).classList.add('active');render()});
function waitBT(){if(window.ArgentasNativeBluetooth)ArgentasNativeBluetooth.startServer()}
function refreshBT(){if(window.ArgentasNativeBluetooth)ArgentasNativeBluetooth.refresh()}
function connectBT(){let v=devices.value;if(v&&window.ArgentasNativeBluetooth)ArgentasNativeBluetooth.connect(v)}
function sync(){if(connected&&window.ArgentasNativeBluetooth)window.ArgentasNativeBluetooth.send(JSON.stringify({type:'state',db:db}))}
function merge(remote){if(!remote)return;let om=new Map(db.orders.map(x=>[x.id,x]));(remote.orders||[]).forEach(x=>{let l=om.get(x.id);if(!l||Number(x.updatedAt)>Number(l.updatedAt))om.set(x.id,x)});db.orders=[...om.values()].sort((a,b)=>b.number-a.number);let pm=new Map(db.products.map(x=>[x.id,x]));(remote.products||[]).forEach(x=>{let l=pm.get(x.id);if(!l||Number(x.updatedAt)>Number(l.updatedAt))pm.set(x.id,x)});db.products=[...pm.values()];db.nextOrder=Math.max(db.nextOrder,remote.nextOrder||1,db.orders.reduce((m,o)=>Math.max(m,o.number+1),1));save();render();toast('Sincronizado');if(connected)sync()}
window.onBluetoothState=(s,m)=>{connected=s==='CONECTADO';conn.textContent='Bluetooth: '+s;btmsg.textContent=m||s;if(connected)sync()}
window.onBluetoothMessage=raw=>{raw.trim().split('\n').filter(Boolean).forEach(line=>{try{let m=JSON.parse(line);if(m.type==='state'||m.type==='hello')merge(m.db)}catch(e){}})}
window.addEventListener('argentas-bluetooth',e=>{if(e.detail.type!=='devices')return;devices.innerHTML='<option value="">Elegí teléfono</option>';e.detail.payload.devices.forEach(x=>{let o=document.createElement('option');o.value=x.address;o.textContent=x.name+' — '+x.address;devices.appendChild(o)})});
render();
</script></body></html>
